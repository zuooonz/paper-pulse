name: paper-pulse CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install ruff pytest-cov && ruff check .
      - run: PYTHONPATH=src pytest -q --cov=src --cov-report=term --cov-fail-under=50

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/paper_pulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: PYTHONPATH=src pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DOMAIN_NAME: qMRI
      NEXT_PUBLIC_TARGET_LABEL: qMRLab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          credential_pattern='sk-''[A-Za-z0-9]{20,}|AK''IA[0-9A-Z]{16}|ghp_''[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          set +e
          git grep -I -l -E -e "$credential_pattern" -- . ':(exclude)**/*lock*'
          credential_status=$?
          set -e
          if [ "$credential_status" -eq 0 ]; then
            echo "Secret scan found a credential pattern."
            exit 1
          elif [ "$credential_status" -gt 1 ]; then
            exit "$credential_status"
          fi
