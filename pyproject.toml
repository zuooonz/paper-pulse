[project]
name = "paper-pulse"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl",
    "PyYAML",
    "pydantic>=2",
    "pypinyin",
    "requests",
    "urllib3>=2.8.0",
    "PyMuPDF>=1.24.0",
    "lxml",
    "python-docx",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.20",
    "pydantic-settings>=2.0",
    "PyJWT>=2.8",
    "cryptography",
    "defusedxml",
    "playwright",
    "markdown",
    "Pillow>=13.0.0",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
postgres = ["psycopg[binary]>=3.1"]
browser = ["patchright"]
pdf = ["curl-cffi"]
tools = ["py7zr>=1.1.3", "beautifulsoup4"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Same import paths whether run as `pytest` or `python -m pytest`.
pythonpath = [".", "src"]
